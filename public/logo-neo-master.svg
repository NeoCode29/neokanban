<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <!-- 1. Warm Cream Linen Background -->
  <rect width="800" height="420" fill="#f4efe6" />

  <g transform="translate(10, 0)">
    <!-- 2. Solid Red Accent Circle (Tucked neatly under 'N' left stem) -->
    <circle cx="198" cy="272" r="42" fill="#c71d2b" />

    <!-- 3. Letter 'N' (Monumental Constructivist Letterform) -->
    <!-- Left vertical stem (shortened at bottom to nestle the red circle) -->
    <path fill="#072235" d="
      M 154 108
      H 228
      V 224
      H 154
      Z
    " />

    <!-- N Diagonal Stroke & Right Stem with Bridge -->
    <path fill="#072235" d="
      M 224 108
      H 340
      V 305
      H 276
      L 204 186
      V 108
      Z
      
      M 265 190
      L 340 305
      H 276
      Z
    " />

    <!-- Right stem of N + bridge to E -->
    <path fill="#072235" d="
      M 284 108
      H 356
      V 305
      H 284
      Z

      M 345 174
      H 375
      V 208
      H 345
      Z
    " />

    <!-- 4. Letter 'E' (Monolithic Block with Precision Negative Cuts) -->
    <path fill="#072235" fill-rule="evenodd" d="
      M 372 108
      H 510
      V 305
      H 372
      Z

      M 425 142
      H 510
      V 175
      H 425
      Z

      M 425 238
      H 510
      V 271
      H 425
      Z
    " />

    <!-- 5. Letter 'O' (Massive Block with Signature Vertical Slit) -->
    <path fill="#072235" fill-rule="evenodd" d="
      M 526 108
      H 662
      V 305
      H 526
      Z

      M 581 156
      H 603
      V 256
      H 581
      Z
    " />
  </g>
</svg>
