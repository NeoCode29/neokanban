<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f2ece0; }
      .dark { fill: #052637; }
      .red { fill: #c51928; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="300" class="bg" />

  <g transform="translate(30, 20)">
    <!-- Red Accent Dot -->
    <circle cx="65" cy="190" r="34" class="red" />

    <!-- Letter 'n' with overhanging roofbar over the red dot -->
    <path class="dark" d="
      M 28 85
      H 216
      V 224
      H 170
      V 128
      H 142
      V 224
      H 96
      V 128
      H 28
      Z
    " />

    <!-- Letter 'e' (Massive block with inner slit & cutaway) -->
    <path class="dark" fill-rule="evenodd" d="
      M 232 85
      H 360
      V 224
      H 232
      Z

      M 278 122
      H 318
      V 146
      H 278
      Z

      M 278 170
      H 360
      V 194
      H 278
      Z
    " />

    <!-- Letter 'o' (Massive block with centered horizontal slit) -->
    <path class="dark" fill-rule="evenodd" d="
      M 376 85
      H 512
      V 224
      H 376
      Z

      M 422 136
      H 466
      V 168
      H 422
      Z
    " />
  </g>
</svg>
