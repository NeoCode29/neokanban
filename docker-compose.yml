services:
  postgres:
    image: postgres:16-alpine
    container_name: neokanban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neokanban
    ports:
      - "5435:5432"
    volumes:
      - neokanban_pgdata:/var/lib/postgresql/data

volumes:
  neokanban_pgdata:
